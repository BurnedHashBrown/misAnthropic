<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in | Filtr.</title>
    <link rel="stylesheet" href="paperfolio.css" />
  </head>
  <body>
    <main class="account-page">
      <section class="account-art">
        <a class="brand" href="index.html"
          ><span class="brand-mark"><i></i><i></i></span><span>Filtr.</span></a
        >
        <h1>A little space can change everything.</h1>
        <p>Return to your private safety tools whenever you need them.</p>
      </section>
      <section class="account-card">
        <a class="text-button" href="index.html">Back to home</a>
        <p class="page-kicker">Log in</p>
        <h2>Welcome back.</h2>
        <form id="accountForm">
          <label for="accountEmail">Email</label
          ><input
            type="email"
            id="accountEmail"
            required
            placeholder="you@example.com"
          /><label for="accountPassword">Password</label
          ><input
            type="password"
            id="accountPassword"
            required
            placeholder="Your password"
          /><button class="arrow-fill-button" type="submit">
            <span>Log in</span><b>↗</b>
          </button>
        </form>
        <p>New to Filtr.? <a href="signup.html">Create account</a></p>
      </section>
    </main>
    <p class="page-notice" id="pageNotice" hidden></p>
    <script src="pages.js"></script>
  </body>
</html>
